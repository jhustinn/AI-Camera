timezone: Asia/Jakarta

camera:
  id: usb-cam
  name: Streaming Webcams (USB)
  source: 1
  width: 1280
  height: 720
  fps: 30
  fourcc: MJPG
  backend: dshow

detection:
  model: yolov8n.pt
  confidence: 0.35
  iou: 0.5
  device: "0"
  tracker: bytetrack
  imgsz: 640
  max_width: 0
  torch_threads: 4
  track_buffer: 30
  classes: [0]

face:
  enabled: true
  model: buffalo_l
  providers: [CPUExecutionProvider]
  det_size: [320, 320]
  similarity_threshold: 0.42
  min_margin: 0.05
  run_every_n_frames: 4
  region_ratio: 0.55
  region_top_offset: 0.12
  widen: 0.12
  crop_max_width: 640
  upscale: 1.5
  score_threshold: 0.55
  min_face_px: 16
  votes_required: 2

presence:
  enter_confirm_sec: 3
  leave_confirm_sec: 3
  away_grace_sec: 60
  min_session_sec: 300
  desk_overlap_ratio: 0.4
  desk_switch_grace_sec: 3

pose:
  enabled: true
  model: yolov8n-pose.pt
  imgsz: 640
  confidence: 0.3
  keypoint_confidence: 0.5
  device: "0"
  every_n_frames: 1
  line_thickness: 2
  radius: 3
  posture_labels: true
  min_keypoints: 8
  bbox_margin: 0.05
  smoothing: 0.25
  hold_frames: 10
  validate_limbs: true
  legs: true
  draw_min_keypoints: 5
  min_inbox_ratio: 0.6
  min_score: 0.5
  sitting_knee_ratio: 0.45
  standing_knee_ratio: 0.6

desks:
  - id: 1
    label: Kursi 1
    employee_id: null
    roi: [0.03, 0.10, 0.42, 1.0]
  - id: 2
    label: Kursi 2
    employee_id: null
    roi: [0.42, 0.10, 0.85, 1.0]

server:
  host: 127.0.0.1
  port: 8000
  poll_seconds: 2
  stream_host: "127.0.0.1"
  stream_port: 8001
  stream_fps: 15
  jpeg_quality: 80

logging:
  level: INFO
  csv_fallback: true
  screenshot_dir: data/screenshots